<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>

<h2>Student Registration Form</h2>

<form>
    <label>Student Name:</label><br>
    <input type="text" name="name" placeholder="Enter You Full Name"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" placeholder="html27@gmail.com"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" placeholder="123xxx"><br><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female<br><br>

    <label>Subjects:</label><br>
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript<br><br>

    <label>Date of Birth:</label><br>
    <input type="date"><br><br>

    <label>Upload File:</label><br>
    <input type="file"><br><br>

    <label>Upload PDF:</label><br>
    <input type="file"><br><br>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</form>

</body>
</html>
