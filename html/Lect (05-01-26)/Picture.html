<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Tag</title>
</head>
<body>
    <h1>Picture Tag Example</h1>
    <picture>
        <source  media="(min-width:768px)" srcset="Back-pack-Bage.jpg">
        <source  media="(min-width:567px)" srcset="SchoolBag.webp">

        <img src="Clock.jpeg" alt="">

    </picture>
</body>
</html>
