<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h1>Order List</h1>
    <ol type="C">
        <li>Apple</li>
        <li>KIW</li>
        <li>Strawberry</li>
        <li>Plum</li>
    </ol>
    <h2>Unorederd List</h2>
     <ul type="circle">
         <li>Apple</li>
        <li>KIW</li>
        <li>Strawberry</li>
        <li>Plum</li>
     </ul>
     <h2>Descrption list</h2>
     <dl>
        <dt>Apple</dt>
        <dd>Apple is a sweet, crunchy fruit rich in fiber and vitamins. It helps improve digestion and keeps the heart healthy.</dd>
     </dl>
</body>
</html>
