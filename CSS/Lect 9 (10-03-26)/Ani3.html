<!DOCTYPE html>
<html>
<head>
<style>

body{
    background:#f0f5e8;
    text-align:center;
}

/* Container */
.chain{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:100px;
}

/* Animal */
.animal{
    font-size:50px;
    animation: move 2s infinite alternate;
}

/* Delay for chain effect */
.animal:nth-child(2){
    animation-delay:0.3s;
}
.animal:nth-child(3){
    animation-delay:0.6s;
}
.animal:nth-child(4){
    animation-delay:0.9s;
}

/* Animation */
@keyframes move{
    from{
        transform: translateY(0);
    }
    to{
        transform: translateY(-30px);
    }
}

</style>
</head>

<body>

<h2>Animal Animation</h2>

<div class="chain">
    <div class="animal">🐶Hello</div>
    <div class="animal">🐱My Name </div>
    <div class="animal">🐼is</div>
    <div class="animal">🐰Mohit</div>
    
    <br><br>
    <div class="animal">😁 What’s on the agenda today?</div>
    <div class="animal">😂</div>

</body>
</html>
