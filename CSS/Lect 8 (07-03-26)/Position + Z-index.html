<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-index</title>
    <style>
        .box{
            height: 200px;
            width: 200px;
            position: absolute;
            
        }
        #box-1{
             
             background: rgb(255, 128, 0);
             top: 50px;
            left: 50px;
            z-index: 1;
        }

        #box-2{
           
            background: rgb(226, 227, 224);
            top: 100px;
            left: 100px;
            z-index: 2;
}
        #box-3 {
            
            background: green;
            top: 150px;
            left: 150px;
            z-index: -1;
}
</style>
</head>
<body>
    <div class="box" id="box-1"></div>
    <div class="box" id="box-2"></div>
    <div class="box" id="box-3"></div>
