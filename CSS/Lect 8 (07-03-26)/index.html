<!DOCTYPE html>
<html>
<head>
<title>My Task</title>

<style>

body{
    font-family: Arial;
}

/* Color + Line Height */
.text{
    color: blue;
    line-height: 30px;
}

/* Cursor */
.btn{
    background: orange;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
}

/* Image Filter */
img{
    width: 300px;
    filter: grayscale(50%);
}

/* Position + Z-index */
.box1{
    width: 200px;
    height: 200px;
    background: red;
    position: absolute;
    top: 50px;
    left: 50px;
    z-index: 1;
}

.box2{
    width: 200px;
    height: 200px;
    background: green;
    position: absolute;
    top: 100px;
    left: 100px;
    z-index: 2;
}

</style>
</head>



</body>
</html>
